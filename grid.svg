<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440"><defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0a45"/><stop offset="1" stop-color="#0d0318"/></linearGradient>
</defs>
<style>
text{font-family:'Trebuchet MS',Verdana,sans-serif}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flow{animation:flow 3s linear infinite}
@keyframes flow{to{stroke-dashoffset:-64}}
</style>
<rect width="900" height="440" rx="18" fill="url(#bg)"/>
<g stroke="#ff2d95" stroke-opacity=".5" stroke-width="1.5"><line x1="450" y1="10" x2="450" y2="430"/><line x1="10" y1="220" x2="890" y2="220"/></g>
