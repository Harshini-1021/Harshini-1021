<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300"><defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0a45"/><stop offset="1" stop-color="#0d0318"/></linearGradient>
</defs>
<style>
text{font-family:'Trebuchet MS',Verdana,sans-serif}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flow{animation:flow 3s linear infinite}
@keyframes flow{to{stroke-dashoffset:-64}}
</style>
<rect width="900" height="300" rx="18" fill="url(#bg)"/><path d="M0 260 H120 L150 230 H300" fill="none" stroke="#ff2d95" stroke-opacity=".4" stroke-width="2" stroke-dasharray="6 10" class="flow"/><path d="M600 40 H700 L730 70 H900" fill="none" stroke="#ff2d95" stroke-opacity=".4" stroke-width="2" stroke-dasharray="6 10" class="flow"/><path d="M0 40 H60 L90 70 H200" fill="none" stroke="#ff2d95" stroke-opacity=".4" stroke-width="2" stroke-dasharray="6 10" class="flow"/><path d="M560 280 H680 L710 250 H900" fill="none" stroke="#ff2d95" stroke-opacity=".4" stroke-width="2" stroke-dasharray="6 10" class="flow"/>
<g filter="url(#glow)">
<rect x="40" y="40" width="470" height="170" rx="26" fill="#14061f" stroke="#ff2d95" stroke-width="3"/>
<path d="M510 105 L565 150 L510 175" fill="#14061f" stroke="#ff2d95" stroke-width="3" stroke-linejoin="round"/>
<line x1="510" y1="108" x2="510" y2="172" stroke="#14061f" stroke-width="6"/>
</g>
<text x="72" y="88" font-size="28" font-weight="bold" fill="#ffd9ec">Hi, I'm Harshini!</text>
<text x="72" y="122" font-size="17" fill="#ffd9ec">EEE student @ KIT | Embedded | IoT | AI</text>
<text x="72" y="150" font-size="17" fill="#ffd9ec">I build smart systems that sense,</text>
<text x="72" y="174" font-size="17" fill="#ffd9ec">think and keep machines healthy.</text>
<text x="72" y="199" font-size="14" fill="#ff2d95" class="pulse">welcome to my circuit board :)</text>
<circle cx="710" cy="150" r="108" fill="none" stroke="#b100ff" stroke-width="2" stroke-dasharray="10 14" class="spin" filter="url(#glow)"/>
<circle cx="710" cy="150" r="90" fill="none" stroke="#ff2d95" stroke-width="3" class="pulse" filter="url(#glow)"/>
<g stroke="#ff2d95" stroke-width="3" stroke-linecap="round" filter="url(#glow)"><line x1="675" y1="78" x2="675" y2="90"/><line x1="675" y1="210" x2="675" y2="222"/><line x1="695" y1="78" x2="695" y2="90"/><line x1="695" y1="210" x2="695" y2="222"/><line x1="725" y1="78" x2="725" y2="90"/><line x1="725" y1="210" x2="725" y2="222"/><line x1="745" y1="78" x2="745" y2="90"/><line x1="745" y1="210" x2="745" y2="222"/><line x1="638" y1="115" x2="650" y2="115"/><line x1="770" y1="115" x2="782" y2="115"/><line x1="638" y1="135" x2="650" y2="135"/><line x1="770" y1="135" x2="782" y2="135"/><line x1="638" y1="165" x2="650" y2="165"/><line x1="770" y1="165" x2="782" y2="165"/><line x1="638" y1="185" x2="650" y2="185"/><line x1="770" y1="185" x2="782" y2="185"/>
<rect x="650" y="90" width="120" height="120" rx="16" fill="#14061f"/></g>
